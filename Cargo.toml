[package]
name = "email-newsletter"
version = "0.1.0"
edition = "2024"

[lib]
name = "email_newsletter"
path = "src/lib.rs"

[dependencies]
actix-web = "4.12.1"
anyhow = "1.0.100"
chrono = "0.4.42"
config = "0.15.19"
log = "0.4.29"
rand = "0.9.2"
serde = "1.0.228"
tokio = { version = "1.48.0", features = ["full"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.22", features = ["registry", "env-filter"] }
uuid = {version = "1.19.0", features = ["v4"]}

[dependencies.sqlx]
version = "0.8.6"
features = [
    "runtime-tokio-rustls", 
    "macros", 
    "postgres", 
    "uuid", 
    "chrono", 
    "migrate",
]

[dev-dependencies]
reqwest = "0.12.28"

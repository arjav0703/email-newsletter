<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      background-color: #111827;
    }

    main {
      display: flex;
      justify-content: center;
    }
  </style>
  <title>Admin Dashboard</title>
</head>

<body>
  <main>
    <div class="nes-container is-dark with-title center-container font-['Press_Start_2P'] text-l w-7xl leading-relaxed">
      <p class="title">Email Newsletter Service</p>
      <ul class="py-3 text-xl">
        <li><a href="/admin/dashboard"><- Back</a></li>
      </ul>

      <h1 class="text-3xl">Publish a new newsletter</h1>
      <form id="newsletterForm" class="p-3">
        <label class="nes-text is-warning">Title
          <input type="text" placeholder="Weekly Newsletter" name="title" id="title" class="nes-input is-warning"
            required>
        </label>
        <br>
        <label class="nes-text is-success">Text Content
          <textarea placeholder="Enter plain text content" name="content" id="content" class="nes-textarea is-success"
            rows="5" required></textarea>
        </label>
        <br>
        <label class="nes-text is-primary">HTML Content
          <textarea placeholder="Enter HTML content" name="html_content" id="html_content"
            class="nes-textarea is-primary" rows="5" required></textarea>
        </label>
        <br>
        <label class="nes-text is-error">Password (for confirmation)
          <input type="password" placeholder="Enter your password" name="password" id="password"
            class="nes-input is-error" required>
        </label>
        <br>
        <button type="submit" class="nes-btn is-success">Publish Newsletter</button>
      </form>
      <div id="message" class="mt-4"></div>

      <script>
        const USERNAME = '{{USERNAME}}';

        document.getElementById('newsletterForm').addEventListener('submit', async (e) => {
          e.preventDefault();

          const form = e.target;
          const submitButton = form.querySelector('button[type="submit"]');
          const messageDiv = document.getElementById('message');

          submitButton.disabled = true;
          submitButton.textContent = 'Publishing...';
          messageDiv.textContent = '';

          const formData = {
            title: form.title.value,
            content: form.content.value,
            html_content: form.html_content.value
          };

          const password = form.password.value;
          const credentials = btoa(USERNAME + ':' + password);

          try {
            const response = await fetch('/newsletter', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Basic ' + credentials
              },
              body: JSON.stringify(formData)
            });

            if (response.ok) {
              messageDiv.innerHTML = '<p class="nes-text is-success">Newsletter published successfully!</p>';
              form.reset();
            } else {
              const errorText = await response.text();
              messageDiv.innerHTML = '<p class="nes-text is-error">Failed to publish newsletter: ' + errorText + '</p>';
            }
          } catch (error) {
            messageDiv.innerHTML = '<p class="nes-text is-error">Error: ' + error.message + '</p>';
          } finally {
            submitButton.disabled = false;
            submitButton.textContent = 'Publish Newsletter';
          }
        });
      </script>
    </div>
  </main>
</body>

</html>

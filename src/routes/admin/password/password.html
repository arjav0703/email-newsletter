<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      background-color: #111827;
    }

    main {
      display: flex;
      justify-content: center;
    }
  </style>
  <title>Admin Dashboard</title>
</head>

<body>
  <main>
    <div class="nes-container is-dark with-title center-container font-['Press_Start_2P'] text-l w-7xl leading-relaxed">
      <p class="title">Email Newsletter Service</p>
      <ul class="py-3 text-xl">
        <li><a href="/admin/dashboard"><- Back</a></li>
      </ul>

      <h1 class="text-3xl">Change Your Password</h1>
      <form action="/admin/password" method="post" class="p-3">
        <label class="nes-text is-warning">Current password
          <input type="password" placeholder="Enter current password" name="current_password" id="inline_field"
            class="nes-input is-warning">
        </label>
        <br>
        <label class="nes-text is-success">New password
          <input type="password" placeholder="Enter new password" name="new_password" id="inline_field"
            class="nes-input is-success">
        </label>
        <br>
        <label class="nes-text is-success">Confirm new password
          <input type="password" placeholder="Type the new password again" name="new_password_check" id="inline_field"
            class="nes-input is-success">
        </label>
        <br>
        <button type="submit" class="nes-btn is-error">Change Password</button>
      </form>

    </div>
  </main>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset=utf-8">
  <title>Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      background-color: #111827;
    }

    main {
      display: flex;
      justify-content: center;
    }

    .error-message {
      color: #d32f2f;
      background-color: #ffebee;
      border: 1px solid #ef5350;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <main class="flex flex-col">
    <div id="error-container"></div>
    <div
      class="nes-container is-dark with-title center-container font-['Press_Start_2P'] w-7xl text-xl leading-relaxed">
      <p class="title">Email Newsletter Service</p>
      <ul class="py-3 text-xl">
        <li><a href="/"><- Back</a></li>
      </ul>

      <h1 class="text-4xl nes-text is-success">Login</h1>
      <form action="/login" method="post" class="p-7">
        <label class="nes-text is-warning">Username
          <input type="text" placeholder="your username..." name="username" id="inline_field"
            class="nes-input is-warning">
        </label>
        <label class="nes-text is-warning">Username
          <input type="password" placeholder="Password..." name="password" id="inline_field"
            class="nes-input is-warning">
        </label>
        <br>
        <button type="submit" class="nes-btn is-success">Login</button>
      </form>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');

    const errorMessages = {
      'unauthorized': 'You must be logged in to access that page.',
      'invalid_credentials': 'Invalid username or password. Please try again.',
      'session_expired': 'Your session has expired. Please log in again.'
    };

    if (error && errorMessages[error]) {
      const errorContainer = document.getElementById('error-container');
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error-message';
      errorDiv.textContent = errorMessages[error];
      errorContainer.appendChild(errorDiv);
    }
  </script>
</body>

</html>

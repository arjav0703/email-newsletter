<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset=utf-8">
  <title>Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      background-color: #111827;
    }

    main {
      display: flex;
      justify-content: center;
    }
  </style>
</head>

<body>
  <main class="flex flex-col">
    <div id="error-container"></div>
    <div
      class="nes-container is-dark with-title center-container font-['Press_Start_2P'] w-7xl text-xl leading-relaxed">
      <p class="title">Email Newsletter Service</p>
      <ul class="py-3 text-xl">
        <li><a href="/"><- Back</a></li>
      </ul>

      <h1 class="text-4xl nes-text is-success">Unsubscribe :(</h1>
      <form action="/unsubscribe" method="post" class="p-7">
        <label class="nes-text is-warning">Email
          <input type="email" placeholder="it's sad to see you go :(" name="email" id="inline_field"
            class="nes-input is-warning">
        </label>
        <br>
        <button type="submit" class="nes-btn is-error">Unsubscribe</button>
      </form>
    </div>
  </main>

</body>

</html>
